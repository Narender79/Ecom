spring.application.name=ecommerce
server.port=${SERVER_PORT:8080}

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.narender.ecommerce=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET:replace_with_min_32_char_secret}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
